<div class="container py-8">
  @if (totalAmount() > 0) {
    <section class="space-y-6">
      <header>
        <p class="text-sm uppercase tracking-[0.2em] text-slate-500">Cart</p>
        <h1 class="mt-2 text-3xl font-semibold text-slate-950">My Cart</h1>
      </header>

      <div class="space-y-4">
        @for (item of items(); track item.product.id) {
          <app-item-cart (size_items)="refreshCart()" [item]="item"></app-item-cart>
        }
      </div>

      <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
        <app-box-info title="Discount" text="$0"></app-box-info>
        <app-box-info title="Shipping" text="$0"></app-box-info>
        <app-box-info title="Items" [text]="totalAmount()"></app-box-info>
        <app-box-info title="Total" [text]="'$' + total()"></app-box-info>
      </div>

      <div>
        <a class="btn-primary" routerLink="/">Checkout</a>
      </div>
    </section>
  } @else {
    <section class="surface-section mx-auto max-w-2xl p-10 text-center">
      <h1 class="text-2xl font-semibold text-slate-950">Your cart is empty</h1>
      <p class="mt-3 text-sm text-slate-600">Add some products to continue shopping.</p>
      <a class="btn-primary mt-6" routerLink="/catalog">Continue shopping</a>
    </section>
  }
</div>
