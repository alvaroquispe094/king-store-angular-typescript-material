<div class="container grid gap-6 py-6 lg:grid-cols-[280px_1fr]">
  <app-sidenav [menu]="_options" title="Categories"></app-sidenav>

  <section class="space-y-4">
    <header>
      <p class="text-sm uppercase tracking-[0.2em] text-slate-500">Store</p>
      <h1 class="mt-2 text-3xl font-semibold text-slate-950">Products</h1>
    </header>

    <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
      @for (product of products(); track product.id) {
        <app-product-card [product]="product"></app-product-card>
      } @empty {
        <p class="text-sm text-slate-500">No products available.</p>
      }
    </div>
  </section>
</div>
