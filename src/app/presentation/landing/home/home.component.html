<section class="space-y-10">
  <div class="container-full">
    <app-carrousel></app-carrousel>
  </div>

  <div class="container">
    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
      <app-box-info image="trophy.svg" title="High Quality" text="High durability materials"></app-box-info>
      <app-box-info image="guarantee.svg" title="Warranty Protection" text="Over 2 years"></app-box-info>
      <app-box-info image="shipping.svg" title="Free Shipping" text="Order over $150"></app-box-info>
      <app-box-info image="customer-support.svg" title="Support 24/7" text="Dedicated support"></app-box-info>
    </div>

    <section class="mt-10">
      <header class="mb-4">
        <p class="text-sm uppercase tracking-[0.2em] text-slate-500">Highlights</p>
        <h2 class="mt-2 text-2xl font-semibold text-slate-900">Novedades</h2>
      </header>

      <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-4">
        @for (company of companies; track company.companyName) {
          <app-card
            [image]="company.image"
            [companyName]="company.companyName"
            [position]="company.position"
            [date]="company.date"></app-card>
        }
      </div>
    </section>

    <section class="mt-10">
      <header class="mb-4">
        <p class="text-sm uppercase tracking-[0.2em] text-slate-500">Catalog preview</p>
        <h2 class="mt-2 text-2xl font-semibold text-slate-900">Detalle de productos</h2>
      </header>

      <div class="surface-section p-6">
        @for (product of products(); track product.id) {
          <div class="border-b border-slate-100 py-3 last:border-b-0">
            <p class="text-sm text-slate-700">
              <span class="font-semibold text-slate-900">{{ product.name }}</span>
              · {{ product.description }} · ${{ product.price }}
            </p>
          </div>
        } @empty {
          <p class="text-sm text-slate-500">No products found.</p>
        }
      </div>
    </section>
  </div>
</section>
