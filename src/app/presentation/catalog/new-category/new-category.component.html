<section class="mx-auto max-w-2xl surface-section p-8">
  <header class="mb-8 text-center">
    <img class="mx-auto h-20 w-20" src="/assets/customer-support.svg" alt="Category form" />
    <h1 class="mt-6 text-3xl font-semibold text-slate-950">
      {{ edit ? 'Update category' : 'Create category' }}
    </h1>
  </header>

  <form class="space-y-5" (ngSubmit)="edit ? updateCategory() : createCategory()" [formGroup]="categoryForm">
    <div>
      <label class="field-label" for="category-name">Name</label>
      <input id="category-name" class="field-input" formControlName="name" />
      @if ((fg['name']?.touched || fg['name']?.dirty) && fg['name']?.invalid) {
        <p class="field-error">{{ getErrorMessage('name') }}</p>
      }
    </div>

    <label class="inline-flex items-center gap-3 text-sm font-medium text-slate-700">
      <input class="h-4 w-4 rounded border-slate-300" type="checkbox" formControlName="active" />
      Active category
    </label>

    <button class="btn-primary w-full" type="submit" [disabled]="categoryForm.invalid || isLoading()">
      @if (isLoading()) {
        <span class="h-5 w-5 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
      } @else {
        <span>Save</span>
      }
    </button>
  </form>
</section>
