<article class="surface-card grid gap-4 p-4 md:grid-cols-[112px_1fr_auto_auto] md:items-center">
  <img
    class="h-24 w-24 rounded-2xl object-cover"
    [src]="item.product.image ? item.product.image : '/assets/noimage.png'"
    [alt]="item.product.name" />

  <div>
    <h3 class="text-lg font-semibold text-slate-900">{{ item.product.name }}</h3>
    <p class="mt-2 text-sm text-slate-600">
      {{ item.product.description.substring(0, 80) }}...
    </p>
  </div>

  <div class="text-lg font-semibold text-slate-900">$ {{ item.product.price }}</div>

  <div class="flex items-center gap-3">
    <button type="button" class="btn-secondary h-10 w-10 rounded-full p-0" (click)="substract()">-</button>
    <span class="min-w-8 text-center text-base font-semibold text-slate-900">{{ item.amount }}</span>
    <button type="button" class="btn-secondary h-10 w-10 rounded-full p-0" (click)="add()">+</button>
    <button type="button" class="btn-secondary ml-2 text-rose-600" (click)="removeItem()">Remove</button>
  </div>
</article>
