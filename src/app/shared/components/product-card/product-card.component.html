<article class="surface-card overflow-hidden">
  <img
    class="h-56 w-full object-cover"
    [src]="product.image ? product.image : '/assets/noimage.png'"
    [alt]="product.name" />

  <div class="space-y-4 p-5">
    <div>
      <h3 class="text-lg font-semibold text-slate-900">{{ product.name }}</h3>
      <p class="mt-2 line-clamp-2 text-sm text-slate-600">{{ product.description }}</p>
    </div>

    <div class="flex items-center justify-between">
      <span class="text-xl font-semibold text-slate-900">$ {{ product.price }}</span>
      <button type="button" class="btn-primary px-4 py-2 text-sm" (click)="addCart()">
        Add to cart
      </button>
    </div>
  </div>
</article>
