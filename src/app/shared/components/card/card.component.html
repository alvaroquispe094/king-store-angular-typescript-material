<article class="surface-card overflow-hidden">
  <img class="h-52 w-full object-cover" [src]="image" [alt]="companyName || 'Card image'" />

  <div class="space-y-2 p-5">
    <h3 class="text-lg font-semibold text-slate-900">{{ companyName }}</h3>
    <p class="text-sm text-slate-600">{{ position }}</p>
    <p class="text-xs uppercase tracking-[0.2em] text-slate-400">{{ date }}</p>
  </div>
</article>
