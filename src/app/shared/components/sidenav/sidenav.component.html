<aside class="surface-card p-4">
  <h3 class="mb-4 text-base font-semibold text-slate-900">{{ title }}</h3>

  <div class="space-y-2">
    @for (node of menu; track node.name) {
      @if (hasChildren(node)) {
        <details class="rounded-2xl border border-slate-200 px-3 py-2">
          <summary class="cursor-pointer list-none text-sm font-medium text-slate-800">
            {{ node.name }}
          </summary>
          <div class="mt-3 flex flex-col gap-2 pl-2">
            @for (child of node.children; track child.name) {
              <a class="rounded-xl px-3 py-2 text-sm text-slate-600 hover:bg-slate-100" [routerLink]="child.link">
                {{ child.name }}
              </a>
            }
          </div>
        </details>
      } @else {
        <a class="block rounded-2xl px-3 py-3 text-sm font-medium text-slate-700 hover:bg-slate-100" [routerLink]="node.link">
          {{ node.name }}
        </a>
      }
    }
  </div>
</aside>
