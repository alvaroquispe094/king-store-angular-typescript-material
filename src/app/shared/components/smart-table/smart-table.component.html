<div class="space-y-4">
  <input
    class="field-input"
    type="search"
    placeholder="Filter rows"
    [(ngModel)]="filterValue"
    (ngModelChange)="applyFilter()" />

  <div class="overflow-x-auto rounded-2xl border border-slate-200">
    <table class="min-w-full divide-y divide-slate-200 bg-white">
      <thead class="bg-slate-50">
        <tr>
          @for (column of displayedColumns; track column) {
            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">
              {{ column }}
            </th>
          }
        </tr>
      </thead>

      <tbody class="divide-y divide-slate-100">
        @for (row of filteredRows; track $index) {
          <tr class="cursor-pointer transition hover:bg-slate-50" (click)="updateItem(row)">
            @for (column of displayedColumns; track column) {
              <td class="px-4 py-3 text-sm text-slate-700">{{ row[column] }}</td>
            }
          </tr>
        } @empty {
          <tr>
            <td class="px-4 py-8 text-center text-sm text-slate-500" [attr.colspan]="displayedColumns.length">
              No data matching "{{ filterValue }}"
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
